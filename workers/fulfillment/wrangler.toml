# The top-level Worker is intentionally a non-production sink. Every remote
# command must select --env staging explicitly.
name = "espanol-honesto-fulfillment-env-required"
main = "src/index.ts"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
minify = true
keep_vars = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[alias]
"astro:env/server" = "./src/astro-env-server.ts"

[observability]
enabled = true

[triggers]
# The base sink must never retain a scheduled trigger.
crons = []

[vars]
# Fail closed if someone deploys the base Worker without --env.
NODE_ENV = "production"
FULFILLMENT_RUNTIME_MODE = "bootstrap"
EMAIL_DELIVERY_MODE = "disabled"
EMAIL_DAILY_RECIPIENT_LIMIT = "0"
EMAIL_MONTHLY_RECIPIENT_LIMIT = "0"

[env.staging]
name = "espanol-honesto-fulfillment-staging"
workers_dev = true

[env.staging.triggers]
crons = ["0 * * * *"]

[[env.staging.queues.producers]]
binding = "FULFILLMENT_QUEUE"
queue = "espanol-honesto-fulfillment-staging-queue"

[[env.staging.queues.consumers]]
queue = "espanol-honesto-fulfillment-staging-queue"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "espanol-honesto-fulfillment-staging-dlq"
max_concurrency = 1
retry_delay = 30

[env.staging.vars]
NODE_ENV = "production"
PUBLIC_APP_ENV = "staging"
SUPABASE_EXPECTED_PROJECT_REF = "mzjyvmlxfpzdfdjzxxyj"
WORKER_IDENTITY = "espanol-honesto-fulfillment-staging"
PUBLIC_SITE_URL = "https://staging.espanolhonesto.com"
CHECKOUT_ENABLED = "false"
CHECKOUT_ENABLED_OVERRIDE = "false"
FULFILLMENT_RUNTIME_MODE = "active"
EMAIL_DELIVERY_MODE = "allowlist"
EMAIL_DAILY_RECIPIENT_LIMIT = "10"
EMAIL_MONTHLY_RECIPIENT_LIMIT = "100"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"
