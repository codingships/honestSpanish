name = "espanol-honesto-fulfillment"
main = "src/index.ts"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
minify = true
keep_vars = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[alias]
"astro:env/server" = "./src/astro-env-server.ts"

[observability]
enabled = true

[triggers]
crons = ["0 * * * *"]

[env.staging]
name = "espanol-honesto-fulfillment-staging"
workers_dev = true

[env.staging.vars]
PUBLIC_APP_ENV = "staging"
WORKER_IDENTITY = "espanol-honesto-fulfillment-staging"
PUBLIC_SITE_URL = "https://espanolhonesto-staging.alindev95.workers.dev"
CHECKOUT_ENABLED = "false"
CHECKOUT_ENABLED_OVERRIDE = "false"
EMAIL_DELIVERY_MODE = "allowlist"
EMAIL_DAILY_RECIPIENT_LIMIT = "10"
EMAIL_MONTHLY_RECIPIENT_LIMIT = "100"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production]
name = "espanol-honesto-fulfillment-production"
workers_dev = true

[env.production.vars]
PUBLIC_APP_ENV = "production"
WORKER_IDENTITY = "espanol-honesto-fulfillment-production"
CHECKOUT_ENABLED = "false"
CHECKOUT_ENABLED_OVERRIDE = "false"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
