name: Deploy Cloudflare staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA already validated by CI
        required: true
        type: string

permissions:
  checks: read
  contents: read

concurrency:
  group: cloudflare-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Validate requested commit shape
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "This privileged workflow must be dispatched from refs/heads/main."
            exit 1
          fi
          if [[ ! "$REQUESTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character Git commit SHA."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checked-out commit
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          resolved_sha="$(git rev-parse HEAD)"
          if [ "$resolved_sha" != "$REQUESTED_COMMIT_SHA" ]; then
            echo "Checked-out commit does not match the requested SHA."
            exit 1
          fi
          printf '%s\n' "DEPLOY_COMMIT_SHA=$resolved_sha" >> "$GITHUB_ENV"

      - name: Require successful CI for the exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          checks_file="$RUNNER_TEMP/github-check-runs.json"
          trap 'rm -f "$checks_file"' EXIT
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$REQUESTED_COMMIT_SHA/check-runs?per_page=100" > "$checks_file"
          node -e '
            const fs = require("node:fs");
            const [file, sha] = process.argv.slice(1);
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const passed = (payload.check_runs ?? []).some((run) =>
              run.name === "build-and-test" && run.head_sha === sha && run.conclusion === "success"
            );
            if (!passed) throw new Error("Refusing staging deploy: exact commit has no successful build-and-test check.");
          ' "$checks_file" "$REQUESTED_COMMIT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact Cloudflare identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: d1a22bcf6477ff2ff31d2bfb83084e44
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for the manual staging deploy."
            exit 1
          fi
          if [ "${CLOUDFLARE_ACCOUNT_ID:-}" != "$EXPECTED_CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID does not match the exact staging account."
            exit 1
          fi

          identity_file="$RUNNER_TEMP/cloudflare-whoami.json"
          trap 'rm -f "$identity_file"' EXIT
          pnpm exec wrangler whoami --json --install-skills=false > "$identity_file"
          pnpm exec tsx scripts/ci/verify-cloudflare-identity.ts \
            --input "$identity_file" \
            --expected-account-id "$EXPECTED_CLOUDFLARE_ACCOUNT_ID"

      - name: Verify exact staging provider identities
        env:
          PUBLIC_SITE_URL: "https://staging.espanolhonesto.com"
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm exec tsx scripts/ci/verify-staging-deploy-environment.ts

      - name: Build exact staging package
        env:
          CI: "true"
          CLOUDFLARE_ENV: "staging"
          PUBLIC_APP_ENV: "staging"
          SUPABASE_EXPECTED_PROJECT_REF: "mzjyvmlxfpzdfdjzxxyj"
          WORKER_IDENTITY: "espanolhonesto-staging"
          PUBLIC_SITE_URL: "https://staging.espanolhonesto.com"
          FULFILLMENT_WORKER_URL: "https://espanol-honesto-fulfillment-staging.alindev95.workers.dev"
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: "build-only-placeholder-service-role"
          STRIPE_SECRET_KEY: "sk_test_build_only_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_build_only_placeholder"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: "build-only-placeholder-turnstile"
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          CRON_SECRET: "build-only-placeholder-cron"
          INTERNAL_JOB_SECRET: "build-only-placeholder-internal-job"
          CHECKOUT_ENABLED: "false"
          CHECKOUT_ENABLED_OVERRIDE: "false"
          EMAIL_DELIVERY_MODE: "allowlist"
        run: pnpm run build:staging:release

      - name: Validate staging Fulfillment package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config workers/fulfillment/wrangler.toml --env staging --dry-run

      - name: Validate staging web package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/dev/deploy-built-worker.ts --environment staging --dry-run

      - name: Deploy staging Fulfillment Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy --config workers/fulfillment/wrangler.toml --env staging --keep-vars
          printf '%s\n' "FULFILLMENT_DEPLOY_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Deploy staging web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run deploy:staging
          printf '%s\n' "WEB_DEPLOY_COMPLETED=true" >> "$GITHUB_ENV"

      - name: Record partial-deploy recovery requirement
        if: failure() && env.FULFILLMENT_DEPLOY_COMPLETED == 'true' && env.WEB_DEPLOY_COMPLETED != 'true'
        shell: bash
        run: |
          printf '%s\n' "::error::Fulfillment deployed but the web deploy did not complete; staging is mixed and must be reconciled before retry."
          printf '%s\n' "### Staging partial deployment" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Fulfillment changed; web did not complete." >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Stop and use the staging rollback/recovery runbook before another deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify staging runtime
        env:
          STAGING_WEB_URL: https://staging.espanolhonesto.com
          STAGING_FULFILLMENT_URL: https://espanol-honesto-fulfillment-staging.alindev95.workers.dev
        run: pnpm run verify:staging-runtime

      - name: Record deployed commit
        shell: bash
        run: |
          printf '%s\n' "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Commit: \`$DEPLOY_COMMIT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- URL: https://staging.espanolhonesto.com" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Checkout: disabled and probed" >> "$GITHUB_STEP_SUMMARY"
