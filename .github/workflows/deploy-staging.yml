name: Deploy Cloudflare staging

on:
  workflow_call:
  workflow_dispatch:

permissions:
  checks: read
  contents: read

concurrency:
  group: cloudflare-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      WEB_WORKER_NAME: espanolhonesto-staging
      FULFILLMENT_WORKER_NAME: espanol-honesto-fulfillment-staging
      STAGING_WEB_URL: https://staging.espanolhonesto.com
      STAGING_FULFILLMENT_URL: https://espanol-honesto-fulfillment-staging.alindev95.workers.dev
      SENTRY_UPLOAD_SOURCEMAPS: "false"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Validate canonical dispatch
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "This privileged workflow must be dispatched from refs/heads/main."
            exit 1
          fi
          if [[ ! "$REQUESTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not resolve a full lowercase commit SHA for main."
            exit 1
          fi

      - name: Checkout canonical main history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify main ancestry and checkout exact commit
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_COMMIT_SHA^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_COMMIT_SHA" refs/remotes/origin/main; then
            echo "Requested commit is not part of the current main history."
            exit 1
          fi
          git checkout --detach "$REQUESTED_COMMIT_SHA"
          resolved_sha="$(git rev-parse HEAD)"
          if [ "$resolved_sha" != "$REQUESTED_COMMIT_SHA" ]; then
            echo "Checked-out commit does not match the requested SHA."
            exit 1
          fi
          printf '%s\n' "DEPLOY_COMMIT_SHA=$resolved_sha" >> "$GITHUB_ENV"
          printf '%s\n' \
            "DEPLOY_MESSAGE=staging:$resolved_sha:run:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            >> "$GITHUB_ENV"

      - name: Require successful CI for the exact commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checks_file="$RUNNER_TEMP/github-check-runs.json"
          trap 'rm -f "$checks_file"' EXIT
          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$REQUESTED_COMMIT_SHA/check-runs?per_page=100" > "$checks_file"
          node -e '
            const fs = require("node:fs");
            const [file, sha] = process.argv.slice(1);
            const payload = JSON.parse(fs.readFileSync(file, "utf8"));
            const successful = new Set(
              (payload.check_runs ?? [])
                .filter((run) =>
                  run.head_sha === sha
                  && run.conclusion === "success"
                  && run.app?.slug === "github-actions"
                )
                .map((run) => run.name)
            );
            const required = ["build-and-test", "database-contract"];
            const missing = required.filter((name) => !successful.has(name));
            if (missing.length > 0) {
              throw new Error(`Refusing staging deploy: exact commit lacks successful checks: ${missing.join(", ")}`);
            }
          ' "$checks_file" "$REQUESTED_COMMIT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify exact Cloudflare identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_CLOUDFLARE_ACCOUNT_ID: d1a22bcf6477ff2ff31d2bfb83084e44
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for the manual staging deploy."
            exit 1
          fi
          if [ "${CLOUDFLARE_ACCOUNT_ID:-}" != "$EXPECTED_CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID does not match the exact staging account."
            exit 1
          fi

          identity_file="$RUNNER_TEMP/cloudflare-whoami.json"
          trap 'rm -f "$identity_file"' EXIT
          pnpm exec wrangler whoami --json --install-skills=false > "$identity_file"
          pnpm exec tsx scripts/ci/verify-cloudflare-identity.ts \
            --input "$identity_file" \
            --expected-account-id "$EXPECTED_CLOUDFLARE_ACCOUNT_ID"

      - name: Verify exact staging provider identities
        env:
          PUBLIC_SITE_URL: "https://staging.espanolhonesto.com"
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm exec tsx scripts/ci/verify-staging-deploy-environment.ts

      - name: Validate complete expected runtime contract
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CHECKOUT_HOLD_FINGERPRINT_SECRET: ${{ secrets.CHECKOUT_HOLD_FINGERPRINT_SECRET }}
          CHECKOUT_ENABLED: "false"
          CHECKOUT_ENABLED_OVERRIDE: "false"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_DAILY_RECIPIENT_LIMIT: "10"
          EMAIL_DELIVERY_MODE: "allowlist"
          EMAIL_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
          EMAIL_MONTHLY_RECIPIENT_LIMIT: "100"
          EMAIL_RECIPIENT_ALLOWLIST: ${{ secrets.EMAIL_RECIPIENT_ALLOWLIST }}
          FULFILLMENT_RUNTIME_MODE: "active"
          FULFILLMENT_WORKER_URL: ${{ env.STAGING_FULFILLMENT_URL }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_TEMPLATE_DOC_ID: ${{ secrets.GOOGLE_TEMPLATE_DOC_ID }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          LEVEL_CHECK_TOKEN_SECRET: ${{ secrets.LEVEL_CHECK_TOKEN_SECRET }}
          PUBLIC_APP_ENV: "staging"
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SITE_URL: ${{ env.STAGING_WEB_URL }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STRIPE_EXPECTED_ACCOUNT_ID: "acct_1TruqOC22M3erP0j"
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_EXPECTED_PROJECT_REF: "mzjyvmlxfpzdfdjzxxyj"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_ALERT_EMAIL: ${{ secrets.SUPPORT_ALERT_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WEB_RUNTIME_MODE: "active"
        run: pnpm run verify:staging-runtime -- --preflight

      - name: Build exact staging package
        env:
          CI: "true"
          CLOUDFLARE_ENV: "staging"
          PUBLIC_APP_ENV: "staging"
          SUPABASE_EXPECTED_PROJECT_REF: "mzjyvmlxfpzdfdjzxxyj"
          WORKER_IDENTITY: "espanolhonesto-staging"
          PUBLIC_SITE_URL: "https://staging.espanolhonesto.com"
          FULFILLMENT_WORKER_URL: "https://espanol-honesto-fulfillment-staging.alindev95.workers.dev"
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: "build-only-placeholder-service-role"
          STRIPE_SECRET_KEY: "sk_test_build_only_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_build_only_placeholder"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: "build-only-placeholder-turnstile"
          CHECKOUT_HOLD_FINGERPRINT_SECRET: "build-only-placeholder-checkout-hold-fingerprint"
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          CRON_SECRET: "build-only-placeholder-cron"
          INTERNAL_JOB_SECRET: "build-only-placeholder-internal-job"
          CHECKOUT_ENABLED: "false"
          CHECKOUT_ENABLED_OVERRIDE: "false"
          EMAIL_DELIVERY_MODE: "allowlist"
        run: pnpm run build:staging:release

      - name: Validate staging Fulfillment package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run fulfillment:validate

      - name: Validate staging web package
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run validate:staging-package

      - name: Capture rollback baselines
        id: baseline
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          active_version() {
            local worker="$1"
            local label="$2"
            local input="$RUNNER_TEMP/$label-deployment-status.json"
            pnpm exec wrangler deployments status --name "$worker" --json > "$input"
            pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
              --input "$input" \
              --worker "$worker"
          }

          web_version="$(active_version "$WEB_WORKER_NAME" web-baseline)"
          fulfillment_version="$(active_version "$FULFILLMENT_WORKER_NAME" fulfillment-baseline)"
          printf '%s\n' "web_version=$web_version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "fulfillment_version=$fulfillment_version" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "### Staging rollback baselines"
            printf '%s\n' "- Web: \`$web_version\`"
            printf '%s\n' "- Fulfillment: \`$fulfillment_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate immutable rollback contract
        id: rollback_contract
        timeout-minutes: 5
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CHECKOUT_HOLD_FINGERPRINT_SECRET: ${{ secrets.CHECKOUT_HOLD_FINGERPRINT_SECRET }}
          CHECKOUT_ENABLED: "false"
          CHECKOUT_ENABLED_OVERRIDE: "false"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_DAILY_RECIPIENT_LIMIT: "10"
          EMAIL_DELIVERY_MODE: "allowlist"
          EMAIL_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
          EMAIL_MONTHLY_RECIPIENT_LIMIT: "100"
          EMAIL_RECIPIENT_ALLOWLIST: ${{ secrets.EMAIL_RECIPIENT_ALLOWLIST }}
          FULFILLMENT_RUNTIME_MODE: "active"
          FULFILLMENT_WORKER_URL: ${{ env.STAGING_FULFILLMENT_URL }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_TEMPLATE_DOC_ID: ${{ secrets.GOOGLE_TEMPLATE_DOC_ID }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          LEVEL_CHECK_TOKEN_SECRET: ${{ secrets.LEVEL_CHECK_TOKEN_SECRET }}
          PUBLIC_APP_ENV: "staging"
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SITE_URL: ${{ env.STAGING_WEB_URL }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STRIPE_EXPECTED_ACCOUNT_ID: "acct_1TruqOC22M3erP0j"
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_EXPECTED_PROJECT_REF: "mzjyvmlxfpzdfdjzxxyj"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_ALERT_EMAIL: ${{ secrets.SUPPORT_ALERT_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WEB_RUNTIME_MODE: "active"
          WEB_BASELINE: ${{ steps.baseline.outputs.web_version }}
          FULFILLMENT_BASELINE: ${{ steps.baseline.outputs.fulfillment_version }}
        run: |
          set -euo pipefail
          web_bindings_file="$RUNNER_TEMP/web-baseline-version.json"
          fulfillment_bindings_file="$RUNNER_TEMP/fulfillment-baseline-version.json"
          rollback_contract_file="$RUNNER_TEMP/staging-rollback-contract.json"
          trap 'rm -f -- "$web_bindings_file" "$fulfillment_bindings_file"' EXIT

          pnpm exec wrangler versions view "$WEB_BASELINE" \
            --name "$WEB_WORKER_NAME" \
            --json > "$web_bindings_file"
          pnpm exec wrangler versions view "$FULFILLMENT_BASELINE" \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$fulfillment_bindings_file"
          pnpm run verify:staging-runtime -- \
            --capture-baseline \
            --web-version-id "$WEB_BASELINE" \
            --fulfillment-version-id "$FULFILLMENT_BASELINE" \
            --web-bindings-file "$web_bindings_file" \
            --fulfillment-bindings-file "$fulfillment_bindings_file" \
            --output "$rollback_contract_file"
          printf '%s\n' "path=$rollback_contract_file" >> "$GITHUB_OUTPUT"

      - name: Mark Fulfillment mutation attempt
        id: attempt_fulfillment
        shell: bash
        run: printf '%s\n' 'started=true' >> "$GITHUB_OUTPUT"

      - name: Deploy staging Fulfillment Worker
        id: deploy_fulfillment
        timeout-minutes: 10
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.fulfillment_version }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
          EMAIL_RECIPIENT_ALLOWLIST: ${{ secrets.EMAIL_RECIPIENT_ALLOWLIST }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_TEMPLATE_DOC_ID: ${{ secrets.GOOGLE_TEMPLATE_DOC_ID }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_ALERT_EMAIL: ${{ secrets.SUPPORT_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/fulfillment-before-deploy.json"
          pnpm exec wrangler deployments status \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$status_file"
          current_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
            --input "$status_file" \
            --worker "$FULFILLMENT_WORKER_NAME")"
          if [ "$current_version" != "$BASELINE_VERSION" ]; then
            echo "::error::Fulfillment drifted after baseline capture."
            exit 1
          fi

          secrets_file="$RUNNER_TEMP/staging-fulfillment-version-secrets.json"
          trap 'rm -f -- "$secrets_file"' EXIT
          pnpm exec tsx scripts/ci/write-cloudflare-version-secrets.ts \
            --role fulfillment \
            --output "$secrets_file"
          versions_file="$RUNNER_TEMP/fulfillment-versions-after-upload.json"
          pnpm exec wrangler versions upload \
            --config workers/fulfillment/wrangler.toml \
            --env staging \
            --name "$FULFILLMENT_WORKER_NAME" \
            --secrets-file "$secrets_file" \
            --strict \
            --experimental-provision=false \
            --experimental-auto-create=false \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE"
          rm -f -- "$secrets_file"
          trap - EXIT
          pnpm exec wrangler versions list \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$versions_file"
          uploaded_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts find-owned \
            --input "$versions_file" \
            --worker "$FULFILLMENT_WORKER_NAME" \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE")"
          uploaded_version_file="$RUNNER_TEMP/fulfillment-uploaded-version.json"
          pnpm exec wrangler versions view "$uploaded_version" \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$uploaded_version_file"
          pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-owned \
            --input "$uploaded_version_file" \
            --worker "$FULFILLMENT_WORKER_NAME" \
            --version-id "$uploaded_version" \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE"
          pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-bindings \
            --input "$uploaded_version_file" \
            --worker "$FULFILLMENT_WORKER_NAME"
          status_file="$RUNNER_TEMP/fulfillment-before-version-activation.json"
          pnpm exec wrangler deployments status \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$status_file"
          pre_activation_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
            --input "$status_file" \
            --worker "$FULFILLMENT_WORKER_NAME")"
          if [ "$pre_activation_version" != "$BASELINE_VERSION" ]; then
            echo "::error::Fulfillment drifted before version activation."
            exit 1
          fi

          pnpm exec wrangler versions deploy "$uploaded_version@100%" \
            --config workers/fulfillment/wrangler.toml \
            --env staging \
            --name "$FULFILLMENT_WORKER_NAME" \
            --message "$DEPLOY_MESSAGE" \
            --yes

          status_file="$RUNNER_TEMP/fulfillment-after-deploy.json"
          version_file="$RUNNER_TEMP/fulfillment-version-after-deploy.json"
          pnpm exec wrangler deployments status \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$status_file"
          deployed_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
            --input "$status_file" \
            --worker "$FULFILLMENT_WORKER_NAME")"
          if [ "$deployed_version" != "$uploaded_version" ]; then
            echo "::error::Fulfillment did not activate the exact uploaded version."
            exit 1
          fi
          pnpm exec wrangler versions view "$deployed_version" \
            --name "$FULFILLMENT_WORKER_NAME" \
            --json > "$version_file"
          pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-owned \
            --input "$version_file" \
            --worker "$FULFILLMENT_WORKER_NAME" \
            --version-id "$deployed_version" \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE"
          printf '%s\n' "version_id=$deployed_version" >> "$GITHUB_OUTPUT"

      - name: Mark web mutation attempt
        id: attempt_web
        shell: bash
        run: printf '%s\n' 'started=true' >> "$GITHUB_OUTPUT"

      - name: Deploy staging web Worker
        id: deploy_web
        timeout-minutes: 10
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.web_version }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CHECKOUT_HOLD_FINGERPRINT_SECRET: ${{ secrets.CHECKOUT_HOLD_FINGERPRINT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_RECIPIENT_ALLOWLIST: ${{ secrets.EMAIL_RECIPIENT_ALLOWLIST }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          LEVEL_CHECK_TOKEN_SECRET: ${{ secrets.LEVEL_CHECK_TOKEN_SECRET }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STRIPE_EXPECTED_ACCOUNT_ID: "acct_1TruqOC22M3erP0j"
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_ALERT_EMAIL: ${{ secrets.SUPPORT_ALERT_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/web-before-deploy.json"
          pnpm exec wrangler deployments status \
            --name "$WEB_WORKER_NAME" \
            --json > "$status_file"
          current_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
            --input "$status_file" \
            --worker "$WEB_WORKER_NAME")"
          if [ "$current_version" != "$BASELINE_VERSION" ]; then
            echo "::error::Web drifted after baseline capture."
            exit 1
          fi

          secrets_file="$RUNNER_TEMP/staging-web-version-secrets.json"
          trap 'rm -f -- "$secrets_file"' EXIT
          pnpm exec tsx scripts/ci/write-cloudflare-version-secrets.ts \
            --role web \
            --output "$secrets_file"
          versions_file="$RUNNER_TEMP/web-versions-after-upload.json"
          pnpm exec wrangler versions upload \
            --config dist/server/wrangler.json \
            --name "$WEB_WORKER_NAME" \
            --secrets-file "$secrets_file" \
            --strict \
            --experimental-provision=false \
            --experimental-auto-create=false \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE"
          rm -f -- "$secrets_file"
          trap - EXIT
          pnpm exec wrangler versions list \
            --name "$WEB_WORKER_NAME" \
            --json > "$versions_file"
          uploaded_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts find-owned \
            --input "$versions_file" \
            --worker "$WEB_WORKER_NAME" \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE")"
          uploaded_version_file="$RUNNER_TEMP/web-uploaded-version.json"
          pnpm exec wrangler versions view "$uploaded_version" \
            --name "$WEB_WORKER_NAME" \
            --json > "$uploaded_version_file"
          pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-owned \
            --input "$uploaded_version_file" \
            --worker "$WEB_WORKER_NAME" \
            --version-id "$uploaded_version" \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE"
          pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-bindings \
            --input "$uploaded_version_file" \
            --worker "$WEB_WORKER_NAME"
          status_file="$RUNNER_TEMP/web-before-version-activation.json"
          pnpm exec wrangler deployments status \
            --name "$WEB_WORKER_NAME" \
            --json > "$status_file"
          pre_activation_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
            --input "$status_file" \
            --worker "$WEB_WORKER_NAME")"
          if [ "$pre_activation_version" != "$BASELINE_VERSION" ]; then
            echo "::error::Web drifted before version activation."
            exit 1
          fi

          pnpm exec wrangler versions deploy "$uploaded_version@100%" \
            --config dist/server/wrangler.json \
            --name "$WEB_WORKER_NAME" \
            --message "$DEPLOY_MESSAGE" \
            --yes

          status_file="$RUNNER_TEMP/web-after-deploy.json"
          version_file="$RUNNER_TEMP/web-version-after-deploy.json"
          pnpm exec wrangler deployments status \
            --name "$WEB_WORKER_NAME" \
            --json > "$status_file"
          deployed_version="$(pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
            --input "$status_file" \
            --worker "$WEB_WORKER_NAME")"
          if [ "$deployed_version" != "$uploaded_version" ]; then
            echo "::error::Web did not activate the exact uploaded version."
            exit 1
          fi
          pnpm exec wrangler versions view "$deployed_version" \
            --name "$WEB_WORKER_NAME" \
            --json > "$version_file"
          pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-owned \
            --input "$version_file" \
            --worker "$WEB_WORKER_NAME" \
            --version-id "$deployed_version" \
            --tag "$DEPLOY_COMMIT_SHA" \
            --message "$DEPLOY_MESSAGE"
          printf '%s\n' "version_id=$deployed_version" >> "$GITHUB_OUTPUT"

      - name: Verify exact staging runtime
        timeout-minutes: 5
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CHECKOUT_HOLD_FINGERPRINT_SECRET: ${{ secrets.CHECKOUT_HOLD_FINGERPRINT_SECRET }}
          CHECKOUT_ENABLED: "false"
          CHECKOUT_ENABLED_OVERRIDE: "false"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_DAILY_RECIPIENT_LIMIT: "10"
          EMAIL_DELIVERY_MODE: "allowlist"
          EMAIL_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
          EMAIL_MONTHLY_RECIPIENT_LIMIT: "100"
          EMAIL_RECIPIENT_ALLOWLIST: ${{ secrets.EMAIL_RECIPIENT_ALLOWLIST }}
          FULFILLMENT_RUNTIME_MODE: "active"
          FULFILLMENT_WORKER_URL: ${{ env.STAGING_FULFILLMENT_URL }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_TEMPLATE_DOC_ID: ${{ secrets.GOOGLE_TEMPLATE_DOC_ID }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          LEVEL_CHECK_TOKEN_SECRET: ${{ secrets.LEVEL_CHECK_TOKEN_SECRET }}
          PUBLIC_APP_ENV: "staging"
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SITE_URL: ${{ env.STAGING_WEB_URL }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STAGING_EXPECTED_WEB_VERSION_ID: ${{ steps.deploy_web.outputs.version_id }}
          STAGING_EXPECTED_FULFILLMENT_VERSION_ID: ${{ steps.deploy_fulfillment.outputs.version_id }}
          STRIPE_EXPECTED_ACCOUNT_ID: "acct_1TruqOC22M3erP0j"
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_EXPECTED_PROJECT_REF: "mzjyvmlxfpzdfdjzxxyj"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_ALERT_EMAIL: ${{ secrets.SUPPORT_ALERT_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WEB_RUNTIME_MODE: "active"
        run: pnpm run verify:staging-runtime

      - name: Roll back failed staging deployment
        if: ${{ (failure() || cancelled()) && steps.attempt_fulfillment.outputs.started == 'true' }}
        timeout-minutes: 4
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          CHECKOUT_HOLD_FINGERPRINT_SECRET: ${{ secrets.CHECKOUT_HOLD_FINGERPRINT_SECRET }}
          CHECKOUT_ENABLED: "false"
          CHECKOUT_ENABLED_OVERRIDE: "false"
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMAIL_DAILY_RECIPIENT_LIMIT: "10"
          EMAIL_DELIVERY_MODE: "allowlist"
          EMAIL_FROM: ${{ secrets.RESEND_FROM_EMAIL }}
          EMAIL_MONTHLY_RECIPIENT_LIMIT: "100"
          EMAIL_RECIPIENT_ALLOWLIST: ${{ secrets.EMAIL_RECIPIENT_ALLOWLIST }}
          FULFILLMENT_RUNTIME_MODE: "active"
          FULFILLMENT_WORKER_URL: ${{ env.STAGING_FULFILLMENT_URL }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_TEMPLATE_DOC_ID: ${{ secrets.GOOGLE_TEMPLATE_DOC_ID }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          LEVEL_CHECK_TOKEN_SECRET: ${{ secrets.LEVEL_CHECK_TOKEN_SECRET }}
          PUBLIC_APP_ENV: "staging"
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          PUBLIC_SITE_URL: ${{ env.STAGING_WEB_URL }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STAGING_EXPECTED_WEB_VERSION_ID: ${{ steps.baseline.outputs.web_version }}
          STAGING_EXPECTED_FULFILLMENT_VERSION_ID: ${{ steps.baseline.outputs.fulfillment_version }}
          STRIPE_EXPECTED_ACCOUNT_ID: "acct_1TruqOC22M3erP0j"
          STRIPE_PORTAL_CONFIGURATION_ID: ${{ secrets.STRIPE_PORTAL_CONFIGURATION_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPABASE_EXPECTED_PROJECT_REF: "mzjyvmlxfpzdfdjzxxyj"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_ALERT_EMAIL: ${{ secrets.SUPPORT_ALERT_EMAIL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WEB_RUNTIME_MODE: "active"
          WEB_ATTEMPTED: ${{ steps.attempt_web.outputs.started }}
          WEB_BASELINE: ${{ steps.baseline.outputs.web_version }}
          FULFILLMENT_BASELINE: ${{ steps.baseline.outputs.fulfillment_version }}
          ROLLBACK_CONTRACT: ${{ steps.rollback_contract.outputs.path }}
          JOB_STATUS: ${{ job.status }}
          STAGING_RUNTIME_MAX_ATTEMPTS: "1"
        run: |
          set -uo pipefail
          cleanup_started_seconds=$SECONDS
          cleanup_budget_seconds=210

          bounded_run() {
            local requested_limit="$1"
            shift
            local elapsed=$((SECONDS - cleanup_started_seconds))
            local remaining=$((cleanup_budget_seconds - elapsed - 5))
            local limit="$requested_limit"
            if [ "$remaining" -le 0 ]; then
              echo '::error::Automatic staging rollback exhausted its 210-second safety budget.'
              return 124
            fi
            if [ "$limit" -gt "$remaining" ]; then
              limit="$remaining"
            fi
            timeout --signal=TERM --kill-after=3s "${limit}s" "$@"
          }

          bounded_sleep() {
            local requested_delay="$1"
            local elapsed=$((SECONDS - cleanup_started_seconds))
            local remaining=$((cleanup_budget_seconds - elapsed - 5))
            local delay="$requested_delay"
            if [ "$remaining" -le 0 ]; then
              return 124
            fi
            if [ "$delay" -gt "$remaining" ]; then
              delay="$remaining"
            fi
            sleep "$delay"
          }

          active_version() {
            local worker="$1"
            local label="$2"
            local input="$RUNNER_TEMP/$label-deployment-status.json"
            bounded_run 25 pnpm exec wrangler deployments status \
              --name "$worker" \
              --json > "$input" || return 1
            pnpm exec tsx scripts/ci/cloudflare-staging-state.ts active \
              --input "$input" \
              --worker "$worker"
          }

          owned_by_this_run() {
            local worker="$1"
            local version="$2"
            local label="$3"
            local input="$RUNNER_TEMP/$label-version-view.json"
            bounded_run 25 pnpm exec wrangler versions view "$version" \
              --name "$worker" \
              --json > "$input" || return 1
            pnpm exec tsx scripts/ci/cloudflare-staging-state.ts assert-owned \
              --input "$input" \
              --worker "$worker" \
              --version-id "$version" \
              --tag "$DEPLOY_COMMIT_SHA" \
              --message "$DEPLOY_MESSAGE"
          }

          rollback_one() {
            local worker="$1"
            local baseline="$2"
            local attempted="$3"
            local label="$4"
            local -a config_args=(--config dist/server/wrangler.json)
            local observation
            local current
            local stable_observations=0
            local required_stable_observations=3
            local max_observations=6

            [ "$attempted" = "true" ] || return 0
            if [ "$label" = "fulfillment" ]; then
              config_args=(
                --config workers/fulfillment/wrangler.toml
                --env staging
              )
            fi

            force_baseline() {
              bounded_run 40 pnpm exec wrangler rollback "$baseline" \
                "${config_args[@]}" \
                --name "$worker" \
                --message "automatic baseline restore after failed $DEPLOY_MESSAGE" \
                --yes
            }

            current="$(active_version "$worker" "$label-before-restore")" || return 1
            if [ "$current" != "$baseline" ] \
              && ! owned_by_this_run "$worker" "$current" "$label-before-restore"; then
              echo "::error::$worker changed to a version not owned by this run; refusing unsafe automatic rollback."
              return 1
            fi
            # Roll back even when the baseline still appears active. Wrangler's rollback
            # path can restore changed secrets and makes this the last known write.
            force_baseline || return 1

            for ((observation = 1; observation <= max_observations; observation += 1)); do
              current="$(active_version "$worker" "$label-current-$observation")" || return 1
              if [ "$current" = "$baseline" ]; then
                stable_observations=$((stable_observations + 1))
                if [ "$stable_observations" -ge "$required_stable_observations" ]; then
                  printf '%s\n' \
                    "- $worker stabilized on baseline \`$baseline\`." \
                    >> "$GITHUB_STEP_SUMMARY"
                  return 0
                fi
              else
                stable_observations=0
                if ! owned_by_this_run "$worker" "$current" "$label-current-$observation"; then
                  echo "::error::$worker changed to a version not owned by this run; refusing unsafe automatic rollback."
                  return 1
                fi
                force_baseline || return 1
              fi
              bounded_sleep 3 || return 1
            done

            echo "::error::$worker did not remain on its baseline for the bounded stability window."
            return 1
          }

          active_baselines_are_exact() {
            local web_active
            local fulfillment_active
            web_active="$(active_version "$WEB_WORKER_NAME" web-final)" || return 1
            fulfillment_active="$(active_version "$FULFILLMENT_WORKER_NAME" fulfillment-final)" || return 1
            if [ "$web_active" != "$WEB_BASELINE" ] \
              || [ "$fulfillment_active" != "$FULFILLMENT_BASELINE" ]; then
              echo '::error::A staging Worker changed after the authenticated rollback smoke.'
              return 1
            fi
            return 0
          }

          printf '%s\n' "### Automatic staging rollback" >> "$GITHUB_STEP_SUMMARY"
          rollback_succeeded=0
          rollback_max_rounds=2
          if [ "$JOB_STATUS" = "cancelled" ]; then
            rollback_max_rounds=1
          fi
          for ((rollback_round = 1; rollback_round <= rollback_max_rounds; rollback_round += 1)); do
            rollback_failed=0
            rollback_one \
              "$WEB_WORKER_NAME" \
              "$WEB_BASELINE" \
              "${WEB_ATTEMPTED:-}" \
              web || rollback_failed=1
            rollback_one \
              "$FULFILLMENT_WORKER_NAME" \
              "$FULFILLMENT_BASELINE" \
              true \
              fulfillment || rollback_failed=1
            if [ "$rollback_failed" -eq 0 ] \
              && bounded_run 60 pnpm run verify:staging-runtime -- \
                --verify-rollback \
                --contract "$ROLLBACK_CONTRACT" \
              && active_baselines_are_exact; then
              rollback_succeeded=1
              break
            fi
            if [ "$rollback_round" -lt "$rollback_max_rounds" ]; then
              echo '::warning::Rollback was not yet stable; retrying the bounded recovery once.'
            fi
          done
          if [ "$rollback_succeeded" -eq 1 ]; then
            printf '%s\n' '- Restored staging runtime smoke and final version IDs: passed.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '::error::Automatic staging rollback did not reach a stable authenticated baseline.'
          exit 1

      - name: Record deployed commit
        shell: bash
        env:
          WEB_VERSION: ${{ steps.deploy_web.outputs.version_id }}
          FULFILLMENT_VERSION: ${{ steps.deploy_fulfillment.outputs.version_id }}
        run: |
          {
            printf '%s\n' "### Staging deployment"
            printf '%s\n' "- Commit: \`$DEPLOY_COMMIT_SHA\`"
            printf '%s\n' "- Web version: \`$WEB_VERSION\`"
            printf '%s\n' "- Fulfillment version: \`$FULFILLMENT_VERSION\`"
            printf '%s\n' "- URL: $STAGING_WEB_URL"
            printf '%s\n' "- Checkout: disabled and probed"
            printf '%s\n' "- Runtime attestation: exact for both Workers"
          } >> "$GITHUB_STEP_SUMMARY"
