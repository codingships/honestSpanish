name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  # Keep an explicitly requested deployment alive if an ordinary main push arrives.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]'))) && github.sha || 'normal' }}
  cancel-in-progress: true

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.classify.outputs.application }}
      browser: ${{ steps.classify.outputs.browser }}
      database: ${{ steps.classify.outputs.database }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Classify changed surfaces
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          : > "$changed_files"
          force_argument=()
          if [ "$FORCE_ALL" = "true" ] \
             || [ -z "${BASE_SHA:-}" ] \
             || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            force_argument=(--force-all)
          else
            git cat-file -e "$BASE_SHA^{commit}"
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"
          fi
          node --experimental-strip-types scripts/ci/classify-changes.ts \
            --files "$changed_files" \
            --output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${force_argument[@]}"

  repository-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Check tracked secrets
        run: node scripts/check-secrets.cjs

  database-contract:
    needs: classify-changes
    if: needs.classify-changes.outputs.database == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create isolated contract databases
        run: |
          createdb checkout_v2_fresh
          createdb checkout_v2_incremental

      - name: Verify migration delta against the event base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No incremental base commit is available for this event."
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git show "${BASE_SHA}:db/schema.sql" > "$RUNNER_TEMP/base-schema.sql"
          git diff --name-only --diff-filter=DMR "$BASE_SHA" HEAD -- 'supabase/migrations/*.sql' \
            > "$RUNNER_TEMP/rewritten-migrations.txt"
          if [ -s "$RUNNER_TEMP/rewritten-migrations.txt" ]; then
            echo "Existing migrations are immutable; add a new migration instead."
            sed 's/^/- /' "$RUNNER_TEMP/rewritten-migrations.txt"
            exit 1
          fi
          git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- 'supabase/migrations/*.sql' \
            | sort > "$RUNNER_TEMP/new-migrations.txt"
          base_max_migration_timestamp="$(
            git ls-tree -r --name-only "$BASE_SHA" -- supabase/migrations \
              | while IFS= read -r migration; do
                  filename="${migration##*/}"
                  timestamp="${filename%%_*}"
                  if [[ "$timestamp" =~ ^[0-9]{14}$ ]]; then
                    echo "$timestamp"
                  fi
                done \
              | sort \
              | tail -n 1
          )"
          declare -A new_migration_timestamps=()
          while IFS= read -r migration; do
            [ -n "$migration" ] || continue
            filename="${migration##*/}"
            timestamp="${filename%%_*}"
            if [[ ! "$timestamp" =~ ^[0-9]{14}$ ]]; then
              echo "New migration lacks a 14-digit timestamp: $migration"
              exit 1
            fi
            if [ -n "$base_max_migration_timestamp" ] \
               && [[ "$timestamp" < "$base_max_migration_timestamp" || "$timestamp" == "$base_max_migration_timestamp" ]]; then
              echo "New migration $migration must sort after base maximum $base_max_migration_timestamp."
              exit 1
            fi
            if [[ -n "${new_migration_timestamps[$timestamp]+present}" ]]; then
              echo "New migrations must not share timestamp $timestamp."
              exit 1
            fi
            new_migration_timestamps[$timestamp]="$migration"
          done < "$RUNNER_TEMP/new-migrations.txt"
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/postgres-supabase-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f "$RUNNER_TEMP/base-schema.sql"
          while IFS= read -r migration; do
            [ -n "$migration" ] || continue
            psql -X -1 -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f "$migration"
          done < "$RUNNER_TEMP/new-migrations.txt"
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/checkout-v2-billing-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/checkout-v2-guarantee.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/teacher-compensation-ledger.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/teacher-compensation-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/teacher-compensation-settlements.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/acquisition-attribution-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/provisional-unit-economics.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/checkout-v2-cycle-progress.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/crm-no-show-idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/fulfillment-recovery-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/admin-teacher-bookable-slot-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/admin-teacher-activation-concurrency.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/support-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/admin-access-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/admin-staff-promotion.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/catalog-v2-admin.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_incremental -f tests/sql/cms-content-workflow.sql

      - name: Verify clean canonical schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/postgres-supabase-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f db/schema.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/checkout-v2-billing-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/checkout-v2-guarantee.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/teacher-compensation-ledger.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/teacher-compensation-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/teacher-compensation-settlements.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/acquisition-attribution-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/provisional-unit-economics.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/checkout-v2-cycle-progress.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/crm-no-show-idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/fulfillment-recovery-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/admin-teacher-bookable-slot-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/admin-teacher-activation-concurrency.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/support-operations.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/admin-access-foundation.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/admin-staff-promotion.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/catalog-v2-admin.sql
          psql -X -v ON_ERROR_STOP=1 -d checkout_v2_fresh -f tests/sql/cms-content-workflow.sql

  build-and-test:
    needs: classify-changes
    if: needs.classify-changes.outputs.application == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Astro types
        env:
          CLOUDFLARE_ENV: "staging"
          PUBLIC_APP_ENV: "staging"
        run: pnpm astro sync

      - name: Check types
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:run

      - name: Verify Search Console MCP
        run: pnpm --filter @espanol-honesto/searchconsole-mcp test

      - name: Check fulfillment Worker types
        run: pnpm run fulfillment:typecheck

      - name: Build
        env:
          CLOUDFLARE_ENV: "staging"
          PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
          PUBLIC_TURNSTILE_SITE_KEY: "placeholder-turnstile-site-key"
          TURNSTILE_SECRET_KEY: "placeholder-turnstile-secret-key"
          CHECKOUT_HOLD_FINGERPRINT_SECRET: "placeholder-checkout-hold-fingerprint-secret"
          PUBLIC_SITE_URL: "https://example.com"
          PUBLIC_APP_ENV: "staging"
          CHECKOUT_ENABLED: "false"
        run: pnpm run build

  public-browser:
    needs: classify-changes
    if: needs.classify-changes.outputs.browser == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run E2E tests (public only)
        env:
          E2E_CI_PUBLIC_PLACEHOLDER: "true"
          PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
        run: pnpm exec playwright test --project=public

  quality-gate:
    if: always()
    needs:
      - classify-changes
      - repository-safety
      - database-contract
      - build-and-test
      - public-browser
    runs-on: ubuntu-latest

    steps:
      - name: Require every selected verification surface
        shell: bash
        env:
          APPLICATION_REQUIRED: ${{ needs.classify-changes.outputs.application }}
          APPLICATION_RESULT: ${{ needs.build-and-test.result }}
          BROWSER_REQUIRED: ${{ needs.classify-changes.outputs.browser }}
          BROWSER_RESULT: ${{ needs.public-browser.result }}
          CLASSIFIER_RESULT: ${{ needs.classify-changes.result }}
          DATABASE_REQUIRED: ${{ needs.classify-changes.outputs.database }}
          DATABASE_RESULT: ${{ needs.database-contract.result }}
          SAFETY_RESULT: ${{ needs.repository-safety.result }}
        run: |
          set -euo pipefail
          failures=()

          require_success() {
            local label="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              failures+=("$label=$result")
            fi
          }

          require_selected() {
            local label="$1"
            local required="$2"
            local result="$3"
            if [ "$required" = "true" ]; then
              require_success "$label" "$result"
            elif [ "$required" != "false" ] || { [ "$result" != "skipped" ] && [ "$result" != "success" ]; }; then
              failures+=("$label=invalid-selection:$required/$result")
            fi
          }

          require_success classifier "$CLASSIFIER_RESULT"
          require_success repository-safety "$SAFETY_RESULT"
          require_selected database "$DATABASE_REQUIRED" "$DATABASE_RESULT"
          require_selected application "$APPLICATION_REQUIRED" "$APPLICATION_RESULT"
          require_selected browser "$BROWSER_REQUIRED" "$BROWSER_RESULT"

          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Quality gate failed: %s\n' "${failures[*]}"
            exit 1
          fi
          echo "Quality gate passed for every selected surface."

  deploy-staging:
    name: Deploy Cloudflare staging
    needs: [quality-gate]
    if: >-
      needs.quality-gate.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[deploy-staging]')))
    permissions:
      checks: read
      contents: read
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
