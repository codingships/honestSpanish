name: Performance audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Measure the checked-out candidate or the canonical staging origin
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - staging
      expected_sha:
        description: Required for staging; must equal the dispatched Git SHA and the accredited deployment SHA
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/performance-audit.yml'
      - 'astro.config.mjs'
      - 'lighthouse.config.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'public/**'
      - 'src/assets/**'
      - 'src/components/blog/**'
      - 'src/components/CookieBanner.astro'
      - 'src/components/LandingPage.astro'
      - 'src/components/LeadCaptureForm.tsx'
      - 'src/components/LevelCheckForm.tsx'
      - 'src/components/PricingModal.tsx'
      - 'src/components/PricingSection.tsx'
      - 'src/components/PublicHomePage.astro'
      - 'src/components/ResponsiveTurnstile.tsx'
      - 'src/components/landing/**'
      - 'src/content/**'
      - 'src/content.config.ts'
      - 'src/i18n/**'
      - 'src/layouts/**'
      - 'src/lib/landing-data.ts'
      - 'src/lib/public-seo.ts'
      - 'src/pages/**'
      - 'src/styles/**'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lighthouse:
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["mobile"]' || '["mobile", "desktop"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CHECKOUT_ENABLED: 'false'
      CHECKOUT_ENABLED_OVERRIDE: 'false'
      CLOUDFLARE_INCLUDE_PROCESS_ENV: 'false'
      E2E_DISABLE_EXTERNAL_INTEGRATIONS: 'true'
      E2E_RUNTIME_ISOLATED: 'true'
      E2E_TARGET_SUPABASE_REF: 'placeholder'
      LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'staging' && 'https://staging.espanolhonesto.com' || 'http://localhost:4321' }}
      LHCI_PROFILE: ${{ matrix.profile }}
      LHCI_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
      LHCI_SCOPE: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}
      PUBLIC_APP_ENV: 'test'
      PUBLIC_SITE_URL: 'http://localhost:4321'
      PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
      PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      SUPABASE_EXPECTED_PROJECT_REF: 'placeholder'
      SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-role-key'
      TEST_BASE_URL: 'http://localhost:4321'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate exact staging input
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_sha must be an exact 40-character lowercase Git SHA.'
            exit 1
          fi
          if [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo 'The dispatched ref must equal expected_sha.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 \
            https://staging.espanolhonesto.com/health \
            > "$RUNNER_TEMP/staging-health.json"
          node -e "const fs=require('node:fs');const v=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(v.status!=='ok'||v.appEnvironment!=='staging')process.exit(1)" \
            "$RUNNER_TEMP/staging-health.json"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Select pinned Chromium
        shell: bash
        run: |
          chrome_path="$(node -p "require('playwright').chromium.executablePath()")"
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"

      - name: Run Lighthouse
        id: lighthouse
        continue-on-error: true
        run: pnpm run performance:audit

      - name: Upload Lighthouse JSON and HTML
        if: always() && steps.lighthouse.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'candidate' }}-${{ matrix.profile }}-${{ github.sha }}
          path: test-results/lighthouse/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Lighthouse regression floors
        if: always() && steps.lighthouse.outcome != 'success'
        run: exit 1
